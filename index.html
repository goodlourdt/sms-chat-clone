<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Angela">
<title>Angela</title>
<style>
:root{--blue:#087aff;--bg:#f5f5f7;--muted:#8e8e93;--line:#dedee3;--ink:#171719}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
body{height:100dvh;overflow:hidden}
.app{height:100%;max-width:720px;margin:auto;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{height:76px;flex-shrink:0;display:grid;grid-template-columns:60px 1fr 60px;align-items:center;text-align:center;padding:4px 10px 8px;border-bottom:1px solid #e7e7eb;background:rgba(245,245,247,.96)}
.back,.menu{font-size:27px;color:var(--blue);background:none;border:0;padding:8px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#d9d9df,#b9bac3);display:flex;align-items:center;justify-content:center;margin:0 auto 3px;color:white;font-size:19px}
.person{font-weight:650;font-size:16px;line-height:1.1}
.subtitle{font-size:11px;color:var(--muted);margin-top:3px}
main{flex:1;overflow-y:auto;padding:20px 13px 16px;overscroll-behavior:contain}
.intro{text-align:center;font-size:12px;color:var(--muted);line-height:1.5;margin:0 auto 22px}
.day{text-align:center;color:var(--muted);font-size:11px;margin:15px 0}
.message-row{display:flex;justify-content:flex-end;margin:9px 0}
.bubble-wrap{max-width:83%;display:flex;flex-direction:column;align-items:flex-end}
.bubble{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--blue);color:white;padding:10px 14px;border-radius:19px 19px 5px 19px;font-size:16px;line-height:1.35;box-shadow:0 1px 1px #0000000b}
.stamp{font-size:10px;color:var(--muted);margin:4px 4px 0}
.empty{text-align:center;color:var(--muted);font-size:14px;line-height:1.55;max-width:260px;margin:80px auto}
.composer{flex-shrink:0;border-top:1px solid var(--line);padding:10px 12px 9px;background:var(--bg)}
.composer-row{display:flex;align-items:flex-end;gap:9px}
.plus{width:34px;height:34px;border:1px solid #c7c7cc;border-radius:50%;background:transparent;color:#777;font-size:23px;line-height:1}
textarea{flex:1;resize:none;max-height:125px;min-height:40px;border:1px solid #d6d6dc;border-radius:22px;background:#fff;padding:10px 14px;font:16px/1.2 -apple-system,BlinkMacSystemFont,sans-serif;outline:none}
.send{width:35px;height:35px;border:0;border-radius:50%;background:var(--blue);color:white;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center}
.send:disabled{background:#b8c8e0}
.footnote{text-align:center;font-size:10px;color:var(--muted);padding-top:7px}
.menu-panel{display:none;position:absolute;z-index:4;top:68px;right:10px;background:white;border:1px solid #ddd;border-radius:14px;box-shadow:0 6px 25px #0002;padding:6px;min-width:190px}
.menu-panel button{display:block;width:100%;text-align:left;padding:12px;border:0;background:white;border-radius:9px;font-size:14px;color:var(--ink)}
.menu-panel button:active{background:#eee}
#fileInput{display:none}
.toast{position:absolute;bottom:95px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:18px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}
@media(prefers-color-scheme:dark){:root{--bg:#000;--ink:#f5f5f7;--muted:#98989f;--line:#303034}header{background:#101012;border-color:#303034}.bubble{background:var(--blue)}textarea{background:#1c1c1e;color:#fff;border-color:#444}.menu-panel,.menu-panel button{background:#202023;color:#fff;border-color:#444}.menu-panel button:active{background:#38383b}.intro{color:var(--muted)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="back" aria-label="Back" onclick="showToast('This space is just for you and Angela.')">‹</button>
    <div>
      <div class="avatar">♡</div>
      <div class="person">Angela</div>
      <div class="subtitle">Your personal space</div>
    </div>
    <button class="menu" aria-label="Options" onclick="toggleMenu()">···</button>
  </header>
  <div class="menu-panel" id="menuPanel">
    <button onclick="exportMessages()">Export conversation</button>
    <button onclick="document.getElementById('importInput').click()">Import backup</button>
    <button onclick="clearMessages()">Delete all messages…</button>
    <button onclick="toggleMenu()">Cancel</button>
  </div>
  <main id="thread">
    <div class="intro">iMessage-style conversation<br>Only you can write here.</div>
    <div id="messages"></div>
  </main>
  <div class="composer">
    <div class="composer-row">
      <button class="plus" aria-label="Options" onclick="toggleMenu()">＋</button>
      <textarea id="draft" rows="1" placeholder="iMessage" aria-label="Message" enterkeyhint="send"></textarea>
      <button class="send" id="send" aria-label="Save message" disabled>↑</button>
    </div>
    <div class="footnote">Saved on this device · No messages are sent to Angela</div>
  </div>
</div>
<input type="file" id="importInput" accept="application/json,.json">
<div class="toast" id="toast"></div>
<script>
const KEY='angela-private-chat-v1';
let messages=[];
try{messages=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(messages))messages=[];}catch(e){messages=[];}
const draft=document.getElementById('draft'), send=document.getElementById('send'), list=document.getElementById('messages'), thread=document.getElementById('thread');
function save(){try{localStorage.setItem(KEY,JSON.stringify(messages));return true;}catch(e){showToast('Could not save. Export a backup and free device storage.');return false;}}
function render(){
 list.replaceChildren();
 if(!messages.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Whenever you have something to say, you can leave it here. Your words will stay in this conversation.';list.append(empty);}
 let lastDate='';
 messages.forEach(m=>{
  const date=new Date(m.time), dayKey=date.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
  if(dayKey!==lastDate){const d=document.createElement('div');d.className='day';d.textContent=dayKey;list.append(d);lastDate=dayKey;}
  const row=document.createElement('div');row.className='message-row';
  const wrap=document.createElement('div');wrap.className='bubble-wrap';
  const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=m.text;
  const stamp=document.createElement('div');stamp.className='stamp';stamp.textContent=date.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  wrap.append(bubble,stamp);row.append(wrap);list.append(row);
 });
 requestAnimationFrame(()=>thread.scrollTop=thread.scrollHeight);
}
function sendMessage(){
 const text=draft.value.trim();if(!text)return;
 messages.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),text,time:new Date().toISOString()});
 if(save()){draft.value='';resizeDraft();send.disabled=true;render();}
}
function resizeDraft(){draft.style.height='auto';draft.style.height=Math.min(draft.scrollHeight,125)+'px';}
draft.addEventListener('input',()=>{resizeDraft();send.disabled=!draft.value.trim();});
draft.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
send.addEventListener('click',sendMessage);
function toggleMenu(){const p=document.getElementById('menuPanel');p.style.display=p.style.display==='block'?'none':'block';}
function showToast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}
function exportMessages(){
 const blob=new Blob([JSON.stringify({app:'Angela personal conversation',version:1,exportedAt:new Date().toISOString(),messages},null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob), a=document.createElement('a');a.href=url;a.download='angela-messages-backup.json';a.click();URL.revokeObjectURL(url);toggleMenu();showToast('Backup export started.');
}
function clearMessages(){
 toggleMenu();if(!confirm('Delete every saved message? Export a backup first if you want to keep a copy.'))return;
 messages=[];save();render();showToast('Messages deleted from this device.');
}
document.getElementById('importInput').addEventListener('change',async e=>{
 const file=e.target.files[0];if(!file)return;
 try{const data=JSON.parse(await file.text());const incoming=Array.isArray(data)?data:data.messages;
 if(!Array.isArray(incoming))throw new Error('Invalid backup');
 if(!confirm('Import '+incoming.length+' messages? They will be added to this conversation.'))return;
 const normalized=incoming.filter(m=>typeof m.text==='string').map(m=>({id:m.id||String(Date.now()+Math.random()),text:m.text,time:m.time||m.createdAt||new Date().toISOString()}));
 messages=messages.concat(normalized).sort((a,b)=>new Date(a.time)-new Date(b.time));save();render();showToast('Backup imported.');
 }catch(err){showToast('That backup file could not be read.');}finally{e.target.value='';}
});
render();
</script>
</body>
</html>
